name: Deploy to GitHub Pages

# Publishes the repository root to Pages, so the app serves from
# https://rize17.github.io/ShipETA/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages has to be switched on once by hand, under
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # The workflow token isn't allowed to create the site itself.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
